name: Build iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Create iOS project
        run: |
          npx cap add ios
          sh scripts/patch-ios.sh
          npx capacitor-assets generate --ios || echo "icons skipped"
          npx cap sync ios

      - name: Build (unsigned)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr G2Dash.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: G2Dash-ipa
          path: G2Dash.ipa

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone -y --cleanup-tag || true
          gh release create iphone G2Dash.ipa --title "G2 Dash for iPhone" --notes "Install G2Dash.ipa with 3uTools or Sideloadly."
